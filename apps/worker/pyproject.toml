[project]
name = "worker"
version = "0.1.0"
description = "VeriCite citation and claim verification worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiolimiter==1.3.0",
    "bibtexparser==2.1.0",
    "fastapi==0.162.0",
    "google-genai==2.33.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "rapidfuzz==3.14.6",
    "sse-starlette==3.5.0",
    "supabase==2.33.0",
    "tenacity==9.1.4",
    "tinyfish==0.11.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "psycopg[binary]==3.3.6",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
